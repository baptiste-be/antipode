<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Antipodia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.carte { height: 500px; width: 100%; border-radius: 5px; }
.boutons { display: flex; gap: 10px; margin-top: 15px; }
button {
  padding: 10px 20px; cursor: pointer; color: white;
  border: none; border-radius: 5px; background-color: #3498db;
}
button.actif { background-color: #e67e22; }
</style>
</head>
<body>
<div id="ma-zone-carte" class="carte"></div>

<div class="boutons">
  <button id="btn-pose" onclick="placerpoint()">Placer le point</button>
  <button onclick="antipode()">Trouver l'Antipode</button>
  <button onclick="googlemaps()">Ouvrir dans Google Maps</button>
</div>

<script>
var maCarte = L.map('ma-zone-carte').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(maCarte);

var monMarqueur = L.marker([0, 0]);
var modePoseActive = false;
var pointPlace = false;
var latitudeActuelle = 0;
var longitudeActuelle = 0;

function placerpoint() {
  modePoseActive = true;
  var bouton = document.getElementById('btn-pose');
  bouton.classList.add('actif');
  bouton.innerText = "Cliquez sur la carte...";
}

maCarte.on('click', function (e) {
  if (!modePoseActive) return;
  latitudeActuelle = e.latlng.lat;
  longitudeActuelle = e.latlng.lng;
  pointPlace = true;
  monMarqueur.setLatLng(e.latlng).addTo(maCarte);

  modePoseActive = false;
  var bouton = document.getElementById('btn-pose');
  bouton.classList.remove('actif');
  bouton.innerText = "Placer le point";
});

function antipode() {
  if (!pointPlace) {
    alert("Veuillez d'abord placer un point sur la carte !");
    return;
  }
  var lat = -latitudeActuelle;
  var lng = longitudeActuelle > 0 ? longitudeActuelle - 180 : longitudeActuelle + 180;

  maCarte.setView([lat, lng], 5);
  monMarqueur.setLatLng([lat, lng]);
  latitudeActuelle = lat;
  longitudeActuelle = lng;
}

function googlemaps() {
  if (!pointPlace) {
    alert("Veuillez d'abord placer un point ou trouver l'antipode !");
    return;
  }
  window.open("https://www.google.com/maps?q=" + latitudeActuelle + "," + longitudeActuelle, '_blank');
}
</script>
</body>
</html>
